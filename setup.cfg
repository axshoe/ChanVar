[metadata]
name = chanvar
version = 1.0.0
author = Angie Xiu
author_email = angie.xiu27@gmail.com
description = In silico functional annotation of rare CACNA1A variants in Familial Hemiplegic Migraine
url = https://thexiulab.org

[options]
packages =
    chanvar
    chanvar.data
    chanvar.structure
    chanvar.evolution
    chanvar.scoring
    chanvar.report
    chanvar.viz
install_requires =
    numpy>=1.24
    scipy>=1.10
    pandas>=2.0
    biopython>=1.81
    requests>=2.28
    scikit-learn>=1.3
    matplotlib>=3.7
    xgboost>=1.7
    shap>=0.42
python_requires = >=3.9

[options.package_data]
chanvar.data =
    *.json
    *.tsv

[options.entry_points]
console_scripts =
    chanvar = chanvar.cli:main

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov>=4.0
